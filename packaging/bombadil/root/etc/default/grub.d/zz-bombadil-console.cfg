# A quiet start in the design system's colours (docs/design/boot-and-wallpaper.md).
#
# Between the boot loader and the desk the screen is the kernel's console. These parameters keep it
# empty (nothing printed unless a start fails, no blinking cursor, no kernel logo) and make its
# background the desk's ground, #101214, instead of black. The colours are scripts/console-palette.py's
# output; tests/test_boot_console.py fails when they differ. The file is read by grub-mkconfig after
# /etc/default/grub and the other drop-ins (the zz- keeps it last), and it adds to the line rather than
# replacing it, so whatever else sets kernel parameters keeps working. The installer copies the live
# system's /etc, so installed systems get this file too.
GRUB_CMDLINE_LINUX_DEFAULT="$GRUB_CMDLINE_LINUX_DEFAULT quiet loglevel=3 systemd.show_status=error rd.udev.log_level=3 vt.global_cursor_default=0 logo.nologo vt.default_red=0x10,0xd0,0x5f,0xe0,0x5b,0x90,0x5c,0xe6,0x5c,0xf0,0x8f,0xe8,0x8d,0xb6,0x8d,0xf2 vt.default_grn=0x12,0x55,0xb3,0xa9,0x9b,0x85,0xb3,0xe8,0x63,0xa0,0xd1,0xc3,0xbc,0xae,0xd0,0xf3 vt.default_blu=0x14,0x55,0x6b,0x3b,0xd5,0xe9,0xb0,0xeb,0x6b,0xa0,0x9a,0x8d,0xe6,0xf2,0xcc,0xf4"
