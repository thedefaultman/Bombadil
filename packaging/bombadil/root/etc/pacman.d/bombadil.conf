# Where Bombadil's own package comes from. /etc/pacman.conf includes this file in its [bombadil] section, and the
# bombadil package owns it, so a later release can change the list. SigLevel here applies to that section.
SigLevel = Optional TrustAll
# A copy on the image itself. (A build made for a test VM on a laptop puts the VM's host above it, as
# BOMBADIL_DEV_SERVER does in scripts/build-package.sh. A release never does.)
Server = file:///var/lib/bombadil/repo
