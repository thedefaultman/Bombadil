# scripts/build-iso.sh builds with a copy of this file that also names Bombadil's own package repository, above the others.
# The image's own /etc/pacman.conf is the pacman package's, and a numbered step of the bombadil package edits it.
[options]
HoldPkg     = pacman glibc
Architecture = auto
CheckSpace
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional
[core]
Include = /etc/pacman.d/mirrorlist
[extra]
Include = /etc/pacman.d/mirrorlist
