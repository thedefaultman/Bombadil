# Bombadil session. The shell is the Quickshell bar; the agent daemon starts with it.
monitor = , preferred, auto, 1

exec-once = agentd
exec-once = quickshell -p /usr/share/bombadil/shell/shell.qml
exec-once = mako
exec-once = bombadil-setup --first-run

general {
    gaps_in = 6
    gaps_out = 12
    border_size = 1
    col.active_border = rgba(d97757ee)
    col.inactive_border = rgba(2a2f36ee)
    layout = dwindle
}
decoration {
    rounding = 12
    blur { enabled = true; size = 6; passes = 2 }
}
animations {
    enabled = true
    bezier = ease, 0.16, 1, 0.3, 1
    animation = windows, 1, 4, ease, slide
    animation = specialWorkspace, 1, 5, ease, slidevert
    animation = fade, 1, 4, ease
}
misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    background_color = 0x101214
}
input { kb_layout = us; follow_mouse = 1 }

# Panels are special workspaces; os-mcp toggles them. The agent may also be asked by key.
bind = SUPER, B, togglespecialworkspace, browser
bind = SUPER, T, togglespecialworkspace, terminal
bind = SUPER, F, togglespecialworkspace, files
bind = SUPER, Q, killactive
bind = SUPER, Return, exec, foot
bind = SUPER SHIFT, R, exec, hyprctl reload
bind = SUPER, Escape, exec, quickshell -p /usr/share/bombadil/shell/shell.qml

# Generated apps float, centered, so they appear as a card over the desktop.
windowrulev2 = float, class:^(python3?|bombadil-.*)$
windowrulev2 = center, class:^(python3?|bombadil-.*)$
windowrulev2 = size 540 660, class:^(python3?)$
