# Linear, through its official remote MCP server.
#
# Looked at on 2026-10-01 without signing in (an unauthenticated initialize request and the two well-known
# documents; nothing was registered or authorized):
#   - POST https://mcp.linear.app/mcp answers 401 with WWW-Authenticate carrying resource_metadata and
#     scope="read write".
#   - Protected-resource metadata names https://mcp.linear.app as the authorization server, scopes read and write.
#   - Authorization-server metadata: authorize, token and register endpoints on mcp.linear.app, S256 PKCE, public
#     clients allowed, authorization_code and refresh_token grants, client_id_metadata_document_supported = true.
#
# A guess, from memory of Linear's published tool list and not looked at on the live server: every tool name, every
# argument name and the shape of every answer below (where in the answer the list, the ids and the urls are, and
# whether the answer comes as structured content or as JSON text; the driver reads either). That is why
# verified is false. Whoever runs this against a real workspace changes what is wrong and then sets it to true.

[server]
service = "linear"
name = "Linear"
url = "https://mcp.linear.app/mcp"
scopes = ["read"]
write_scopes = ["write"]
reads = "Issues assigned to you in Linear."
verified = false

[list]
tool = "list_issues"
arguments = { assignee = "me", limit = "{limit}" }
items = "issues"
why = "assigned to you"
done = ["Done", "Canceled", "Duplicate"]

[list.map]
ref = "identifier"
title = "title"
status = "status"
due = "dueDate"
url = "url"

[[list.fields]]
label = "Project"
at = "project"

[create]
tool = "create_issue"
noun = "issue"
fields = [
  { key = "title", label = "Title", edit = "line", required = true },
  { key = "team", label = "Team", edit = "line", required = true },
  { key = "description", label = "Description", edit = "text" },
]

[create.result]
id = "identifier"
url = "url"

[comment]
tool = "create_comment"
target = "issueId"
noun = "issue"
fields = [
  { key = "body", label = "Comment", edit = "text", required = true },
]

[comment.result]
url = "url"
