# Bombadil's tips: one [[tip]] row per tip, in the teaching register of docs/design/voice-brief.md.
# docs/TIPS.md says what every field means, how a tip is gated and how it is counted as tried.
#
#   id          unique, kebab-case, never reused once shipped
#   section     start | work | code | machine
#   order       a whole number, fixed inside its section
#   line        one line, at most 272 px at 13 px Inter; {app}, {project} and {ai} are filled from the machine
#   words       exactly what the button puts in the pill ("" when the tip has no button)
#   marks       words or keys drawn as marks in place of a button
#   needs       what the machine must be able to do before the tip shows anywhere
#   card        false for a tip only the Tips app shows (its button does not fit the card's row)
#   tried_when  what agentd sees that makes the tip tried, with no model
#   captions    three phase captions, at most three words each; "You ask", "It works", "You have it" unless the
#               brief words a tip's own (only the first tip does). They are proposals for the voice thread.
#   beats       the scene (a later piece; a row ships with beats = [] until then)
#
# A tip whose gate is not met, or whose placeholder cannot be filled, is shown nowhere.

[[tip]]
id = "make-an-app"
section = "start"
order = 1
line = "Say what you need. It gets made."
words = "Make me a ticketing app"
marks = []
needs = ["model"]
card = true
tried_when = ["words", "tool:create_app"]
captions = ["You ask", "It builds", "You have it"]
beats = []

